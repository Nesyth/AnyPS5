name: Linux agc_driver_dcc_keys_first_write for boykopovar/AnyPS5#4700

on:
  push:
    branches: [ci/linux-dcc-keys-4700]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      MAIN_SHA: d53960612fcfeb0b4c5e2738fafbecaf6ac983cb
      PR_HEAD: 2fb6dccd756459524ebf2f206da337cec00300da
      TEST_FIX: c809601df8868b2b62643f29025e32ea37703c09
    steps:
      - uses: actions/checkout@v7
        with:
          repository: boykopovar/AnyPS5
          ref: ${{ env.MAIN_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Merge the pull request head and the test fix into main
        run: |
          git fetch --no-tags origin refs/pull/4700/head
          if [ "$(git rev-parse FETCH_HEAD)" != "$PR_HEAD" ]; then echo "::error::refs/pull/4700/head is $(git rev-parse FETCH_HEAD), not $PR_HEAD"; exit 1; fi
          git fetch --no-tags https://github.com/Nesyth/AnyPS5 refs/heads/ci/4700-test-fix
          if [ "$(git rev-parse FETCH_HEAD)" != "$TEST_FIX" ]; then echo "::error::ci/4700-test-fix is $(git rev-parse FETCH_HEAD), not $TEST_FIX"; exit 1; fi
          if [ "$(git rev-parse FETCH_HEAD~2)" != "$PR_HEAD" ]; then echo "::error::the two test commits do not sit directly on the pull request head"; exit 1; fi
          git -c user.name=ci -c user.email=ci@localhost merge --no-ff --no-edit FETCH_HEAD
          git submodule update --init --recursive
          git log --oneline -4
      - name: Install lavapipe and the audio development files, as the upstream linux job does
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers libpipewire-0.3-dev libpulse-dev libasound2-dev
      - name: Configure with the upstream linux job's options
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DANYPS5_ENABLE_SPIRV_TOOLS=ON
      - name: Build the test
        run: cmake --build build --target agc_driver_dcc_keys_first_write_tests
      - name: Run agc_driver_dcc_keys_first_write with the pull request and the test fix
        env:
          ANYPS5_REQUIRE_VULKAN: 1
          GALLIUM_OVERRIDE_CPU_CAPS: avx
        run: ctest --test-dir build -R '^agc_driver_dcc_keys_first_write$' --output-on-failure --timeout 120
      - name: Negative check 1, without the ClearSingle memory check in fastTexture (must fail in the write-watched run)
        env:
          ANYPS5_REQUIRE_VULKAN: 1
          GALLIUM_OVERRIDE_CPU_CAPS: avx
        run: |
          python3 - <<'EOF'
          path = 'core/libs/prx/libSceAgcDriver/Graphics/src/ShaderResources.cpp'
          text = open(path, encoding='utf-8').read()
          old = '} else if ((keys == DccKeys::Uncompressed || keys == DccKeys::ClearSingle) && !GuestMemory::UnchangedSince(address, bytes, record.entryGeneration)) {'
          new = '} else if (keys == DccKeys::Uncompressed && !GuestMemory::UnchangedSince(address, bytes, record.entryGeneration)) {'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected the fastTexture line once, found it {count} times')
          open(path, 'w', encoding='utf-8').write(text.replace(old, new))
          EOF
          git diff --stat
          cmake --build build --target agc_driver_dcc_keys_first_write_tests
          if ctest --test-dir build -R '^agc_driver_dcc_keys_first_write$' --output-on-failure --timeout 120 > negative1.log 2>&1; then
            cat negative1.log
            echo "::error::the test passed without the fastTexture check"
            exit 1
          fi
          cat negative1.log
          grep -q 'after the first texel of the block changed from write-watched memory: component 0 of thread 0 is 0x3f800000, expected 0x00000000' negative1.log || { echo "::error::the test failed, but not with the stale write-watched sample"; exit 1; }
          echo "As expected: without the fastTexture check the write-watched run samples the stale texel."
          git checkout -- core/libs/prx/libSceAgcDriver/Graphics/src/ShaderResources.cpp
      - name: Negative check 2, without the ClearSingle memory check in cachedTexture (must fail in the unwatched run)
        env:
          ANYPS5_REQUIRE_VULKAN: 1
          GALLIUM_OVERRIDE_CPU_CAPS: avx
        run: |
          python3 - <<'EOF'
          path = 'core/libs/prx/libSceAgcDriver/Graphics/src/ShaderResources.cpp'
          text = open(path, encoding='utf-8').read()
          old = 'if ((*keys != DccKeys::Uncompressed && *keys != DccKeys::ClearSingle) || GuestMemory::UnchangedSince(address, it->bytes.size(), it->generation) || equalsCommitted()) {'
          new = 'if (*keys != DccKeys::Uncompressed || GuestMemory::UnchangedSince(address, it->bytes.size(), it->generation) || equalsCommitted()) {'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected the cachedTexture line once, found it {count} times')
          open(path, 'w', encoding='utf-8').write(text.replace(old, new))
          EOF
          git diff --stat
          cmake --build build --target agc_driver_dcc_keys_first_write_tests
          if ctest --test-dir build -R '^agc_driver_dcc_keys_first_write$' --output-on-failure --timeout 120 > negative2.log 2>&1; then
            cat negative2.log
            echo "::error::the test passed without the cachedTexture check"
            exit 1
          fi
          cat negative2.log
          grep -q 'after the first texel of the block changed from unwatched memory: component 0 of thread 0 is 0x3f800000, expected 0x00000000' negative2.log || { echo "::error::the test failed, but not with the stale unwatched sample"; exit 1; }
          echo "As expected: without the cachedTexture check the unwatched run samples the stale texel."
          git checkout -- core/libs/prx/libSceAgcDriver/Graphics/src/ShaderResources.cpp
      - name: Negative check 3, without the comp-to-single source reset in cachedTexture (must fail in the pending storage image run)
        env:
          ANYPS5_REQUIRE_VULKAN: 1
          GALLIUM_OVERRIDE_CPU_CAPS: avx
        run: |
          python3 - <<'EOF'
          path = 'core/libs/prx/libSceAgcDriver/Graphics/src/ShaderResources.cpp'
          text = open(path, encoding='utf-8').read()
          old = '    if (source != nullptr && resource.dccAddress != 0 && (keys.has_value() ? *keys : scanKeys()) == DccKeys::ClearSingle) source.reset();\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected the cachedTexture source reset once, found it {count} times')
          open(path, 'w', encoding='utf-8').write(text.replace(old, ''))
          EOF
          git diff --stat
          cmake --build build --target agc_driver_dcc_keys_first_write_tests
          if ctest --test-dir build -R '^agc_driver_dcc_keys_first_write$' --output-on-failure --timeout 120 > negative3.log 2>&1; then
            cat negative3.log
            echo "::error::the test passed without the cachedTexture source reset"
            exit 1
          fi
          cat negative3.log
          grep -q 'comp-to-single keys stored over a pending storage image: component 0 of thread 0 is 0x00000000, expected 0x3f800000' negative3.log || { echo "::error::the test failed, but not with the view of the pending image"; exit 1; }
          echo "As expected: without the source reset the pending image's unexpanded texel is sampled."
          git checkout -- core/libs/prx/libSceAgcDriver/Graphics/src/ShaderResources.cpp